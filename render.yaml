services:
  - type: web
    name: backend-portfolio-api
    runtime: docker
    repo: https://github.com/PVG341/BackendPortfolio
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: CORS_ORIGIN
        sync: false
      - key: ABUSE_KEY_NAMESPACE
        value: portfolio
      - key: ABUSE_KEY_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          name: backend-portfolio-redis
          type: keyvalue
          property: connectionString
      - key: DEMO_DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        value: onboarding@resend.dev
  - type: keyvalue
    name: backend-portfolio-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
