services:
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio_demo
      POSTGRES_USER: portfolio_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DEMO_READER_PASSWORD: ${POSTGRES_DEMO_READER_PASSWORD:?Set POSTGRES_DEMO_READER_PASSWORD in root .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - ./docker/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio_owner -d portfolio_demo']
      interval: 5s
      timeout: 3s
      retries: 10
